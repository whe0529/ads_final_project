name: faas_env
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - pyarrow                # parquet I/O
  - pytorch>=2.1
  - pytorch-cuda=12.1      # GPU (ariel-v4)
  - pip:
      - "uni2ts>=1.2.0"    # Moirai foundation model
      - gluonts            # Moirai 입력/평가 유틸
      - "peft>=0.11.0"     # 단일 LoRA 어댑터
      - "transformers>=4.40"
      - pyyaml
      - huggingface_hub
